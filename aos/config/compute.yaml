# Token Capacity & Compute Manager (TCCM) policy. ALL numbers marked "prior" are uncalibrated assumptions
# that are replaced by measured results (.aos/usage ledger + model-quality benchmark) once enough samples exist.
version: 1
default_mode: balanced          # local_first | balanced | quality_first

modes:
  local_first:
    min_p_local: 0.5            # use a local model only if its (measured or prior) success probability >= this
    non_local_cost_multiplier: 3.0
  balanced: {}
  quality_first:
    difficult_level: 3          # task level >= this -> maximise success probability among eligible models

estimation:
  output_to_input_ratio: 0.25   # prior: expected output tokens as a fraction of input tokens
  max_output_tokens: 8000
  local_cost_usd_per_mtok: 0.0  # electricity/wear ignored by default; set if you want to account for it
  failure_penalty_usd: 0.10     # ranking-only penalty per expected failed attempt (NOT counted as spend)
  latency_penalty_usd_per_min: 0.02   # ranking-only
  latency_prior_s: {local: 60, cloud: 15}
  max_attempts: 3

priors:
  min_samples: 5                # measured stats override priors at this many samples per (model, category)
  success:                      # prior P(success) by model tier and task level (assumptions, not measurements)
    local_small: {1: 0.70, 2: 0.30, 3: 0.08, 4: 0.01}
    local_mid:   {1: 0.85, 2: 0.55, 3: 0.20, 4: 0.03}
    local_large: {1: 0.92, 2: 0.70, 3: 0.40, 4: 0.10}
    small:       {1: 0.90, 2: 0.60, 3: 0.25, 4: 0.05}
    balanced:    {1: 0.97, 2: 0.88, 3: 0.60, 4: 0.25}
    strong:      {1: 0.98, 2: 0.93, 3: 0.78, 4: 0.45}
    strongest:   {1: 0.99, 2: 0.96, 3: 0.88, 4: 0.60}

task_categories:
  deterministic_first: [repo_search, test_summary, diff_summary, lookup]    # use scripts, not an LLM, where possible
  local_suitable:                                       # category -> minimum local model size in billions of params (heuristic)
    classification: 1
    summarization: 3
    documentation: 3
    repo_search_assist: 3
    code_explanation: 7
    small_change: 7
    transform: 3
  never_unverified_local: [security_critical]           # local output needs verification by a stronger model

local_models:
  # Memory fit uses: GB = params_B * bytes_per_param(quant) + overhead_gb. Estimates, not measurements.
  quant_bytes_per_param: {q4: 0.6, q8: 1.1}
  overhead_gb: 1.5
  ram_fraction_for_model: 0.6         # CPU inference: leave headroom for OS + the coding agent itself
  vram_fraction_for_model: 0.85
  size_classes_b: [1, 3, 8, 14, 32, 70]
  tier_by_size: {1: local_small, 3: local_small, 8: local_mid, 14: local_mid, 32: local_large, 70: local_large}
  # Families only - versions change quickly and licences differ (some restrict commercial use). VERIFY before use.
  families_to_consider: [Qwen-Coder, Llama, Gemma, Phi, Mistral, DeepSeek-Coder]

cache:
  default_ttl_s: 86400
  require_temperature_zero: true
  max_entries: 5000

credits:
  stale_after_days: 90
