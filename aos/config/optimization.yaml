# Thresholds are INITIAL values. Recalibrate from .aos/metrics.jsonl (see /aos-audit).
version: 1

complexity:
  dimensions: [scope, architecture, security, data_integrity, interacting_systems, business_criticality, uncertainty, coverage_gap]
  max_per_dimension: 3
  # total score (0-24) -> level. A total <= l1_max is level 1, <= l2_max is level 2, <= l3_max is level 3, else 4.
  l1_max: 3
  l2_max: 8
  l3_max: 14
  # Any one of these dimensions at 3 forces at least this level, whatever the total.
  floor_overrides:
    security: 4
    data_integrity: 4
    business_criticality: 3

escalation:
  # Level bump after this many failed attempts WITH new evidence. Identical retries never escalate.
  failures_before_escalate: 2
  max_level: 4
  switch_provider_after_evidence_based_failures: 4

context:
  budget_tokens: {1: 4000, 2: 10000, 3: 24000, 4: 40000}   # estimated tokens for the task bundle
  max_snippet_lines: 80
  max_files: {1: 3, 2: 8, 3: 16, 4: 24}
  priority_order: [P0, P1, P2, P3, P4, P5, P6]
  always_load: [P0, P1, P2, P3]

session:
  # Estimated thresholds (fraction of window). Compaction is advised, never forced.
  compact_advice_at: 0.60
  compact_strongly_at: 0.80
  repeated_failures_for_fork: 3
  large_tool_output_lines: 200

tool_output:
  max_inline_lines: 40
  artifact_dir: ".aos/artifacts"

memory:
  stale_after_days: 180
  global_allowed_categories: [user_preference, reusable_pattern, lesson_general]
