# Project registry - intentionally EMPTY in Phase 1 (generic AOS). Project review and scoping is Phase 2.
# Without an entry, AOS uses the repo directory name as the project id and memory starts empty.
# Entry format (map keyed by project id; `repo` is matched against the git origin URL):
#
# projects:
#   my-project:
#     repo: owner/name
#     status: verified-accessible   # record what is VERIFIED, not assumed
#     note: "one line"
version: 1
projects: {}
