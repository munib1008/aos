# Build manifest for the dormakaba distribution. This is a packaging decision, not policy: dormakaba-policy.yaml is untouched
# and still needs approval from the dormakaba IT / information-security owner to change.
version: 1
# Everything below is removed from the dormakaba build. The Token Capacity & Compute Manager (TCCM) depends on or describes
# features the policy disables (local runtimes, free tiers, credits, automatic switching), so the whole module is left out.
# Enabling any of it later needs a policy decision first.
exclude: [config/credits.yaml, config/compute.yaml, config/routing.yaml, core, scripts/tccm.py, skills/aos-token-capacity, skills/aos-local-inference, skills/aos-model-routing, commands/aos-capacity.md, commands/aos-model.md]
generic_only_tests: [test_tccm.py, fakeserver.py]
strip_blocks: [default]
